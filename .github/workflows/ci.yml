name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Uji E2E & Audit Tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          node server/index.js &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            if [ "$i" -eq 30 ]; then echo "Server tidak sehat" >&2; exit 1; fi
            sleep 1
          done

      - name: E2E test
        run: node e2e-test.js

      - name: Audit endpoint semua tab
        run: node tab-audit.js

  deploy-railway:
    name: Deploy Backend ke Railway
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Railway up
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Token belum diatur
        if: env.RAILWAY_TOKEN == ''
        run: echo "::notice::Tambahkan secret RAILWAY_TOKEN di Settings → Secrets → Actions agar auto-deploy Railway aktif."
